name: Add Ski Day from Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-ski-day:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process Issue & Update Table
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x .github/scripts/process_ski_day.py
          python .github/scripts/process_ski_day.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: add ski day from issue #${{ github.event.issue.number }}" || echo "Keine Änderungen"
          git push

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file issue_comment.md
          gh issue close "$ISSUE_NUMBER" --reason "completed"
